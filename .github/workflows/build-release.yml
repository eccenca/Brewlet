name: Build and Release

on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10
  # Manual runs build and package without releasing, so the workflow itself can
  # be smoke-tested without burning a version number.
  workflow_dispatch:

# The job-scoped GITHUB_TOKEN is read-only by default; publishing a release
# needs write access to repository contents.
permissions:
  contents: write

jobs:
  build:

    # Pinned rather than macos-latest, so a runner image roll cannot change
    # the Xcode version a release was built with. Bump deliberately.
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v4
      with:
        # Full history and tags: the "Stamp version from git" build phase reads
        # the nearest tag for CFBundleShortVersionString and the commit count
        # for CFBundleVersion. A shallow checkout silently falls back to
        # MARKETING_VERSION.
        fetch-depth: 0

    - name: Install Task
      run: brew install go-task

    # The same commands used locally, so CI and a developer's machine cannot
    # drift: Release archive, export, and a ditto-compressed build/Brewlet.zip.
    - name: Build and package
      run: task package

    - name: Extract release notes
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        version="${GITHUB_REF_NAME#v}"
        awk -v version="$version" '
          index($0, "## [" version "]") == 1 { inside = 1; next }
          inside && /^## / { exit }
          inside { print }
        ' CHANGELOG.md > release-notes.md
        if [ -s release-notes.md ]; then
          echo "notes=--notes-file=release-notes.md" >> "$GITHUB_ENV"
        else
          echo "::warning::no CHANGELOG section for $version; generating notes"
          echo "notes=--generate-notes" >> "$GITHUB_ENV"
        fi

    - name: Create Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "$GITHUB_REF_NAME" build/Brewlet.zip \
          --title "$GITHUB_REF_NAME" "$notes"
